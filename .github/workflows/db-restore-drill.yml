# Backup/restore drill (issue #4: "a restore has been TESTED end-to-end at
# least once - not just assumed").
#
# Runs the exact same procedure as the nightly backup - the shared
# scripts/db-backup.sh functions: dump -> encrypt -> decrypt -> restore ->
# verify - but against a throwaway Postgres seeded through the REAL
# migrations, so it needs no production secrets and can run any time. A green
# run here means the nightly workflow's mechanics are proven, independent of
# whether the production secrets are configured yet.
name: DB backup restore drill

on:
  workflow_dispatch:

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Throwaway passphrase: the drill only proves the mechanics.
      BACKUP_PASSPHRASE: drill-only-passphrase-${{ github.run_id }}
      SOURCE_URL: postgresql://postgres:postgres@localhost:5432/drill_source
      RESTORE_URL: postgresql://postgres:postgres@localhost:5432/drill_restore
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Create the source database with the real schema (migrations)
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: drill_source
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres \
            -c 'CREATE DATABASE drill_source'
          npm ci
          node node_modules/typeorm/cli-ts-node-commonjs.js -d src/data-source.ts migration:run

      - name: Seed representative data
        run: |
          psql "$SOURCE_URL" <<'SQL'
          INSERT INTO users (id, email, password, role, "tokenVersion")
          VALUES ('11111111-1111-1111-1111-111111111111', 'drill@example.test', 'x', 'user', 0);
          -- inventory/images are TypeORM simple-json: plain text columns.
          INSERT INTO products (id, name, description, price, inventory, images)
          VALUES ('22222222-2222-2222-2222-222222222222', 'Drill Coat', 'restore drill', 99.99,
                  '[{"size":"M","quantity":1}]', '[]');
          INSERT INTO orders (id, "userId", "totalAmount", status)
          VALUES ('33333333-3333-3333-3333-333333333333',
                  '11111111-1111-1111-1111-111111111111', 99.99, 'completed');
          INSERT INTO order_items (id, "orderId", "productId", quantity, price, size)
          VALUES ('44444444-4444-4444-4444-444444444444',
                  '33333333-3333-3333-3333-333333333333',
                  '22222222-2222-2222-2222-222222222222', 1, 99.99, 'M');
          SQL

      - name: 'Drill: dump -> encrypt -> decrypt -> restore -> verify'
        run: |
          bash scripts/db-backup.sh dump "$SOURCE_URL" drill.dump
          bash scripts/db-backup.sh encrypt drill.dump
          test ! -f drill.dump  # plaintext must be gone after encryption
          bash scripts/db-backup.sh decrypt drill.dump.gpg drill-restored.dump
          psql postgresql://postgres:postgres@localhost:5432/postgres \
            -c 'CREATE DATABASE drill_restore'
          bash scripts/db-backup.sh restore "$RESTORE_URL" drill-restored.dump
          bash scripts/db-backup.sh verify "$RESTORE_URL"

      - name: Confirm the seeded rows survived the round trip
        run: |
          for check in \
            "SELECT count(*) FROM users|1" \
            "SELECT count(*) FROM orders|1" \
            "SELECT count(*) FROM order_items|1" \
            "SELECT email FROM users|drill@example.test" \
            "SELECT status FROM orders|completed"; do
            query="${check%|*}"; expected="${check#*|}"
            actual=$(psql "$RESTORE_URL" -Atc "$query")
            if [ "$actual" != "$expected" ]; then
              echo "::error::restore mismatch: '$query' -> '$actual' (expected '$expected')"
              exit 1
            fi
            echo "OK: $query -> $actual"
          done
          echo "Restore drill passed: data identical after dump/encrypt/decrypt/restore."
